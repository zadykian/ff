name: ci

# Every pull request, whatever its base, as pull requests may be stacked. On main, the commits
# pushed by hand: the fast-forward workflow's pushes start no workflow.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  # Any finding fails the job, warnings included: each tool fails on any finding as it is.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Release binaries for Linux on amd64, each with its SHA-256 from the release's checksums
      # file or GitHub's asset digest.
      ACTIONLINT: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      SHELLCHECK: 0.11.0
      SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
      SHFMT: 3.14.1
      SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
      ZIZMOR: 1.30.1
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the tools
        run: |
          mkdir "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          gh=https://github.com
          actionlint=$gh/rhysd/actionlint/releases/download/v$ACTIONLINT
          shellcheck=$gh/koalaman/shellcheck/releases/download/v$SHELLCHECK
          shfmt=$gh/mvdan/sh/releases/download/v$SHFMT
          zizmor=$gh/zizmorcore/zizmor/releases/download/v$ZIZMOR
          curl -fsSLo actionlint.tar.gz "$actionlint/actionlint_${ACTIONLINT}_linux_amd64.tar.gz"
          curl -fsSLo shellcheck.tar.gz "$shellcheck/shellcheck-v$SHELLCHECK.linux.x86_64.tar.gz"
          curl -fsSLo shfmt "$shfmt/shfmt_v${SHFMT}_linux_amd64"
          curl -fsSLo zizmor.tar.gz "$zizmor/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" actionlint.tar.gz \
              "$SHELLCHECK_SHA256" shellcheck.tar.gz "$SHFMT_SHA256" shfmt \
              "$ZIZMOR_SHA256" zizmor.tar.gz | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          tar -xzf shellcheck.tar.gz --strip-components 1 "shellcheck-v$SHELLCHECK/shellcheck"
          tar -xzf zizmor.tar.gz zizmor
          chmod +x shfmt
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # actionlint runs ShellCheck on the workflows' scripts; the action's are files.
      - name: actionlint
        run: actionlint
      - name: zizmor
        run: zizmor .
      # shfmt -f finds the shell scripts by their shebang too, as tests/run has no extension.
      - name: ShellCheck and shfmt
        run: |
          mapfile -t scripts < <(shfmt -f .)
          shellcheck "${scripts[@]}"
          shfmt -i 4 -d "${scripts[@]}"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tests/run
